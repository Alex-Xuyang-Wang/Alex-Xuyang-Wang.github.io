    <path d="M76 44v-6a16 16 0 0 1 32 0v6" fill="none" stroke="#6b4a1f" stroke-width="6" stroke-linecap="round"/>
    <rect x="58" y="40" width="68" height="82" rx="20" fill="#d98b2b"/>
    <rect x="68" y="80" width="48" height="32" rx="8" fill="#b56d17"/>
    <rect x="72" y="56" width="40" height="7" rx="3.500" fill="#f4c27a"/>
    <rect x="86" y="92" width="12" height="7" rx="3.500" fill="#f4c27a"/>
    <rect x="12" y="12" width="74" height="24" rx="11" fill="#9a5b3c"/>
    <text x="49" y="29" font-family="Arial, Helvetica, sans-serif" font-size="12.500" font-weight="700" fill="#fff" text-anchor="middle">TOP PICK</text>
