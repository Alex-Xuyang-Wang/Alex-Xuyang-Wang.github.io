    <circle cx="154" cy="225" r="14" fill="#9a5b3c"/>
    <path d="M154 218v14M147 225h14" stroke="#fff" stroke-width="2.600" stroke-linecap="round"/>
  </g>

  <!-- card 3: water bottle -->
  <g transform="translate(432 128)">
    <rect width="184" height="248" rx="16" fill="#fff" stroke="#ead9cc" stroke-width="1.500"/>
    <rect x="12" y="12" width="160" height="120" rx="11" fill="#eaf4ee"/>
    <rect x="82" y="26" width="20" height="12" rx="4" fill="#1f5c43"/>
    <path d="M76 44a8 8 0 0 1 8-8h16a8 8 0 0 1 8 8v6c6 4 8 9 8 15v45a10 10 0 0 1-10 10H78a10 10 0 0 1-10-10V65c0-6 2-11 8-15Z" fill="#3a9c72"/>
    <rect x="68" y="76" width="48" height="24" fill="#d7efe3"/>
    <rect x="76" y="84" width="30" height="7" rx="3.500" fill="#3a9c72"/>
    <rect x="16" y="148" width="124" height="11" rx="5.500" fill="#3b2a22"/>
    <rect x="16" y="167" width="66" height="9" rx="4.500" fill="#dccdc2"/>
    <use href="#stars" x="24" y="196"/>
    <text x="16" y="233" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#9a5b3c">$19.50</text>
    <circle cx="154" cy="225" r="14" fill="#f6ebe4"/>
    <path d="M154 218v14M147 225h14" stroke="#9a5b3c" stroke-width="2.600" stroke-linecap="round"/>
