<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Online store showing personalized product recommendations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3ec"/>
      <stop offset="1" stop-color="#f1e1d5"/>
    </linearGradient>
    <g id="star"><path d="M0-7 2.1-2.2 7.2-1.9 3.2 1.4 4.5 6.4 0 3.6-4.5 6.4-3.2 1.4-7.2-1.9-2.1-2.2Z"/></g>
    <g id="stars" fill="#e2a63b">
      <use href="#star" x="0"/><use href="#star" x="17"/><use href="#star" x="34"/><use href="#star" x="51"/>
      <use href="#star" x="68" fill="#e3d6cc"/>
    </g>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- store top bar -->
  <rect width="640" height="62" fill="#ffffff"/>
  <rect y="62" width="640" height="1.5" fill="#ead9cc"/>
  <rect x="24" y="19" width="26" height="26" rx="7" fill="#9a5b3c"/>
  <path d="M31 28h12l-1.6 9h-8.8Z M34 28a3 3 0 0 1 6 0" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <rect x="62" y="26" width="58" height="11" rx="5.5" fill="#3b2a22"/>
  <rect x="160" y="16" width="330" height="32" rx="16" fill="#f6ebe4"/>
  <circle cx="182" cy="31" r="6.5" fill="none" stroke="#9a5b3c" stroke-width="2.4"/>
  <path d="M187 36l5 5" stroke="#9a5b3c" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="202" y="27" width="120" height="9" rx="4.5" fill="#e3cbbb"/>
  <circle cx="548" cy="32" r="15" fill="#f6ebe4"/>
  <circle cx="548" cy="28" r="5" fill="#9a5b3c"/>
  <path d="M538 42a10 8 0 0 1 20 0Z" fill="#9a5b3c"/>
  <path d="M582 24h5l4 14h14l3-10h-19" fill="none" stroke="#3b2a22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="593" cy="44" r="2.6" fill="#3b2a22"/><circle cx="603" cy="44" r="2.6" fill="#3b2a22"/>
  <circle cx="610" cy="20" r="8" fill="#d9534f"/>
  <text x="610" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>

