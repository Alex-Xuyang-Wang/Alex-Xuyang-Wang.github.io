  <text x="616" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9a5b3c" text-anchor="end">Based on your ratings</text>

  <!-- card 1: sneaker -->
  <g transform="translate(24 128)">
    <rect width="184" height="248" rx="16" fill="#fff" stroke="#ead9cc" stroke-width="1.5"/>
    <rect x="12" y="12" width="160" height="120" rx="11" fill="#eef4f8"/>
    <path d="M40 98c0-14 6-30 14-38l20 12c8 10 24 16 44 18 14 2 22 8 22 16H40Z" fill="#3f7fb0"/>
    <path d="M36 104h108v6a6 6 0 0 1-6 6H42a6 6 0 0 1-6-6Z" fill="#23445f"/>
    <path d="M78 70l-6 9M90 77l-6 9M102 82l-6 9" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="16" y="148" width="118" height="11" rx="5.500" fill="#3b2a22"/>
    <rect x="16" y="167" width="78" height="9" rx="4.500" fill="#dccdc2"/>
